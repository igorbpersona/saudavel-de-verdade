<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudável de Verdade</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <style>
        :root{
            --img-size: clamp(280px, 60vmin, 640px); /* responsive image size */
            --text-color: #5f2202;
            --bg: #ebf5cb;
            --link-color: #344e15;
            --link-hover-color: #546e35;
            --font: 'Quicksand', sans-serif;
        }

        html,body{
            height:100%;
            margin:0;
            font-family:var(--font);
            background:var(--bg);
            color:var(--text-color);
        }

        /* center everything */
        body{
            display:flex;
            align-items:center;      /* vertical center */
            justify-content:center;  /* horizontal center */
        }

        .stack{
            text-align:center;
            display:flex;
            flex-direction:column;
            gap:0.75rem;
            align-items:center;
        }

        picture, .logo {
            width: var(--img-size);
            max-width: 90vw;
        }

        .logo{
            width: 90%;
            height:auto;
            display:block;
            max-width:90vw;
            margin: 1.3rem;
        }

        .coming{
            font-size:34px;
            opacity:0.9;
        }
        .icon {
            width: 40px;
            height: 40px;
            margin-right: 12px;
        }
        .contact {
            margin-top: 100px;
            padding: 0;
        }
        .contact li {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        a {
            font-size: 18px;
            color:var(--link-color);
        }

        a:hover {
            color:var(--link-hover-color);
        }
    </style>
</head>
<body>
<div class="stack" role="main" aria-labelledby="comingText">
    <picture>
        <!-- Small screens -->
        <source srcset="images/logo-saudavel-de-verdade-vertical.png" media="(max-width: 600px)">
        <!-- Medium and large screens -->
        <source srcset="images/logo-saudavel-de-verdade.png" media="(min-width: 601px)">
        <!-- Fallback (if browser doesn’t support <picture>) -->
        <img src="images/logo-saudavel-de-verdade.png" alt="Logo Saudável de Verdade" class="logo" />
    </picture>

    <div id="comingText" class="coming">Em breve...</div>

    <div class="contact-wrapper">
        <ul class="contact">
            <li>
                <img src="images/icons/instagram-couve.svg" alt="Instagram" class="icon" />
                <a href="https://www.instagram.com/armazem.saudaveldeverdade/" target="_blank" rel="noopener noreferrer">@armazem.saudaveldeverdade</a>
            </li>
            <li>
                <img src="images/icons/facebook-couve.svg" alt="Facebook" class="icon" />
                <a href="https://www.facebook.com/armazem.saudaveldeverdade" target="_blank" rel="noopener noreferrer">/armazem.saudaveldeverdade</a>
            </li>
            <li>
                <img src="images/icons/whatsapp-couve.svg" alt="Whatsapp" class="icon" />
                <a href="https://wa.me/5541988339516" target="_blank" rel="noopener noreferrer">(41)98833-9516</a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
