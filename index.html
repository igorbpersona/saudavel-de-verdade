<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudável de Verdade</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --img-size: clamp(280px, 60vmin, 640px); /* responsive image size */
            --text-color: #4C2B0C;
            --bg: #EBF5CC;
            --font: 'Quicksand', sans-serif;
        }

        html,body{
            height:100%;
            margin:0;
            font-family:var(--font);
            background:var(--bg);
            color:var(--text-color);
        }

        /* center everything */
        body{
            display:flex;
            align-items:center;      /* vertical center */
            justify-content:center;  /* horizontal center */
        }

        .stack{
            text-align:center;
            display:flex;
            flex-direction:column;
            gap:0.75rem;
            align-items:center;
        }

        picture, .logo {
            width: var(--img-size);
            max-width: 90vw;
        }

        .logo{
            width: 90%;
            height:auto;
            display:block;
            max-width:90vw;
            margin: 1.3rem;
        }

        .coming{
            font-size:1.2rem;
            opacity:0.9;
            letter-spacing:0.03em;
        }
    </style>
</head>
<body>
<div class="stack" role="main" aria-labelledby="comingText">
    <picture>
        <!-- Small screens -->
        <source srcset="images/logo-saudavel-de-verdade-vertical.png" media="(max-width: 600px)">
        <!-- Medium and large screens -->
        <source srcset="images/logo-saudavel-de-verdade.png" media="(min-width: 601px)">
        <!-- Fallback (if browser doesn’t support <picture>) -->
        <img src="images/logo-saudavel-de-verdade.png" alt="Logo Saudável de Verdade" class="logo" />
    </picture>

    <div id="comingText" class="coming">Em breve...</div>
</div>
</body>
</html>
